    note: Signed and notarised by Apple. Open the DMG and drag Chipload into Applications.
  linux:
    name: Linux
    detail: In preparation
  requirements: Needs a GPU with Vulkan, Metal or DirectX 12 support. Machine control works with GRBL 1.1 and compatible firmware (e.g. grblHAL) via USB serial.
  safety: Always check generated G-code and keep the emergency stop within reach.

