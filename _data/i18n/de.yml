meta_description: Chipload ist eine kostenlose CAD/CAM- und GRBL-Steuerungs-App für Windows und macOS. Zeichnen oder SVG/DXF importieren, Fräsbahnen planen, in 3D prüfen und den G-Code direkt an die Fräse senden.

